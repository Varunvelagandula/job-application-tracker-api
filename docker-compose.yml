services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: tracker, POSTGRES_PASSWORD: tracker, POSTGRES_DB: tracker }
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://tracker:tracker@db:5432/tracker
      SECRET_KEY: change-me
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
